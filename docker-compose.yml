services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tinymd:${POSTGRES_PASSWORD}@db:5432/tinymd
      HACKCLUB_CLIENT_ID: ${HACKCLUB_CLIENT_ID}
      HACKCLUB_CLIENT_SECRET: ${HACKCLUB_CLIENT_SECRET}
      HACKCLUB_REDIRECT_URI: ${HACKCLUB_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tinymd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tinymd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinymd -d tinymd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
